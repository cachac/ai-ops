# kubernetes quota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
    pods: "10"
    services: "5"
    persistentvolumeclaims: "4"
---
# kubernetes limit range
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limit-range
  namespace: dev
spec:
  limits:
    - default:
        cpu: 5m
        memory: 20Mi
      defaultRequest:
        cpu: 10m
        memory: 12Mi
      max:
        cpu: "4"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
      type: Container
